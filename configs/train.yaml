data:
  type: synthetic
  k_neighbors: 32
  noise_std: 0.003
  cache: false
  synthetic_train_points: 20000
  synthetic_val_points: 10000
  # Coverage-extended distribution: original 6 closed-form shapes + 3 new
  # families (plane, gaussian_bump, monge_patch) that broaden the supp(D_syn)
  # on the II_x manifold. monge_patch resamples (a, b, c) per call → covers
  # the full (κ1, κ2) ∈ ℝ² plane.
  proportions:
    cylinder:      0.10   # strong axial anisotropy
    torus:         0.12   # moderate varying anisotropy
    saddle:        0.10   # symmetric hyperbolic
    sphere:        0.05   # isotropic baseline
    ellipsoid:     0.13   # spatially varying
    box:           0.10   # piecewise planar (sharp-ish CAD)
    plane:         0.10   # κ → 0 coverage
    gaussian_bump: 0.10   # smooth κ variation, mixed elliptic/hyperbolic
    monge_patch:   0.20   # random quadric → full (κ1, κ2) plane

model:
  k: 20
  emb_dims: 256
  dropout: 0.2
  in_dims: 6          # 3=coords only, 6=coords+normals (recommended)
  max_log_half: 1.5
  predict_confidence: true

loss:
  lambda_aniso: 0.1   # eigenvalue-ratio log-distance; corrects LogEuclidean trace bias
  lambda_conf:  0.1   # directional-saliency supervision (legacy field name: confidence)
  lambda_topo:  0.01  # det + cond barriers (metric-degeneracy guard)
  lambda_j:     0.0   # optional unrolled PD loss; current train.py fails fast if >0
  topo_det_eps:  1.0e-3
  topo_cond_max: 50.0

training:
  batch_size: 64
  epochs: 400
  lr: 0.0001
  weight_decay: 1.0e-5
  lr_scheduler: plateau   # 'plateau' (ReduceLROnPlateau) or 'step' (StepLR)
  lr_decay_gamma: 0.5
  lr_patience: 20
  lr_min: 1.0e-6
  lr_decay_step: 100      # only used when lr_scheduler == 'step'
  num_workers: 0          # WSL2 multiprocessing instability — keep at 0
  mixed_precision: false
  checkpoint_dir: ./checkpoints
  select_by: val_loss     # 'val_loss' or 'val_metric'
  early_stop_patience: 150
  early_stop_min_delta: 1.0e-4
