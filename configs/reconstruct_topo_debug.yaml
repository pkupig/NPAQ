model:
  k: 20
  emb_dims: 256
  dropout: 0.5

smoothing:
  lambda: 0.1
  k: 10

features:
  curvature_threshold: 0.2
  cluster_eps: 0.05
  min_cluster_size: 10
  line_smoothing: 0.0
  feature_vertex_threshold: 0.05

miq:
  poisson_depth: 8
  crossfield_mu: 30.0
  gradient_size: 0.12
  seam_int_weight: 5.0
  integer_constraints: true

pd:
  mu: 0.1
  iterations: 30
  unroll_grad_iters: 5
  anti_flip_weight: 10.0
  anti_flip_eps: 1.0e-6
  freeze_rounding_grad: true

topology:
  strict: true
  allow_boundary: true
