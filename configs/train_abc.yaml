data:
  type: abc
  # Expected layout (from scripts/abc_preprocess.py):
  #   data/abc_preprocessed/train/*.npz
  #   data/abc_preprocessed/val/*.npz
  # Create with:
  #   python scripts/download_abc.py --chunks 0 1 --output data/abc --preprocess
  root_dir: data/abc_preprocessed
  k_neighbors: 32
  noise_std: 0.005
  # cache=true caches all .npz files + KDTrees in RAM up-front. Required for
  # acceptable training speed: with cache=false, each __getitem__ would re-
  # decode the .npz and rebuild a 100k-point KDTree (the dominant DataLoader
  # cost on preprocessed datasets). For ABC's many small files this is ~1 GB.
  cache: true
  use_normal: true

model:
  k: 20
  emb_dims: 256
  dropout: 0.2
  in_dims: 6
  max_log_half: 1.5
  predict_confidence: true

loss:
  lambda_aniso: 0.1
  lambda_conf:  0.1   # directional-saliency supervision (legacy field name: confidence)
  lambda_topo:  0.01
  lambda_j:     0.0   # optional unrolled PD loss; current train.py fails fast if >0
  topo_det_eps:  1.0e-3
  topo_cond_max: 50.0

training:
  batch_size: 64
  epochs: 100
  lr: 0.0003
  weight_decay: 1.0e-5
  lr_scheduler: step
  lr_decay_step: 20
  lr_decay_gamma: 0.5
  num_workers: 0
  mixed_precision: false
  checkpoint_dir: ./checkpoints_abc
