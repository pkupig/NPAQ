model:
  k: 20
  emb_dims: 256
  dropout: 0.5

smoothing:
  lambda: 0.1
  k: 10

features:
  curvature_threshold: 0.2
  cluster_eps: 0.05
  min_cluster_size: 10
  line_smoothing: 0.0
  feature_vertex_threshold: 0.05

miq:
  poisson_depth: 6
  crossfield_mu: 10.0
  umbilic_smoothing: true
  anisotropy_eps: 0.03
  mu_min_ratio: 0.05
  gradient_size: 1.0
  seam_int_weight: 5.0
  integer_constraints: true
  require_closed_topology: true
  anisotropy_schedule: [1.0, 0.7, 0.45, 0.25, 0.0]
  integer_projection_iters: 3
  integer_potential_iters: 4
  max_param_dist: 1.2
  igl_direct_round: false
  igl_miq_iter: 15

pd:
  mu: 0.1
  iterations: 30
  unroll_grad_iters: 5
  anti_flip_weight: 10.0
  anti_flip_eps: 1.0e-6
  freeze_rounding_grad: true

topology:
  strict: true
  allow_boundary: false
  min_quads: 80
  retry_profiles:
    - gradient_size: 0.2
      crossfield_mu: 20.0
      poisson_depth: 7
      use_igl_backend: false
      require_closed_topology: true
      anisotropy_schedule: [1.0, 0.7, 0.45, 0.25, 0.0]
      integer_projection_iters: 3
      integer_potential_iters: 4
      max_param_dist: 1.2
      igl_direct_round: false
      igl_miq_iter: 15
    - gradient_size: 0.12
      crossfield_mu: 30.0
      poisson_depth: 8
      use_igl_backend: false
      require_closed_topology: true
      anisotropy_schedule: [1.0, 0.7, 0.45, 0.25, 0.0]
      integer_projection_iters: 3
      integer_potential_iters: 4
      max_param_dist: 1.2
      igl_direct_round: false
      igl_miq_iter: 15
    - gradient_size: 0.08
      crossfield_mu: 35.0
      poisson_depth: 9
      use_igl_backend: false
      require_closed_topology: true
      anisotropy_schedule: [1.0, 0.7, 0.45, 0.25, 0.0]
      integer_projection_iters: 3
      integer_potential_iters: 4
      max_param_dist: 1.2
      igl_direct_round: false
      igl_miq_iter: 15
