data:
  type: synthetic
  k_neighbors: 32
  consistency_queries: 8
  consistency_radius_ratio: 0.22
  noise_std: 0.003
  cache: false
  synthetic_train_points: 30000
  synthetic_val_points: 10000
  proportions:
    cylinder:  0.15
    torus:     0.25
    saddle:    0.25
    sphere:    0.10
    ellipsoid: 0.25

model:
  k: 20
  emb_dims: 256
  dropout: 0.15
  in_dims: 6
  max_log_half: 1.5
  predict_confidence: true
  predict_singularity: false

loss:
  lambda_dir:  0.1
  dir_stop_threshold: 0.05
  lambda_sing: 0.0
  lambda_ph:   0.0
  ph_euler_char: 0.0
  lambda_j:    0.0
  lambda_conf: 0.1
  # Topology proxy loss: det_barrier + cond_barrier + anisotropy-weighted entropy.
  # Differentiable, no quad pipeline required. Start low; increase if divergence occurs.
  lambda_topo: 0.05
  topo_det_eps: 1.0e-3
  topo_cond_max: 30.0
  topo_entropy_weight: 0.1
  topo_field_weight: 0.75
  topo_ring_weight: 0.35
  topo_cons_metric_weight: 1.0
  topo_cons_dir_weight: 0.5
  topo_consistency_sigma: 0.35
  topo_ring_min_queries: 6

training:
  batch_size: 64
  epochs: 50
  # Reduced LR for fine-tuning: ~1/5 of the base training LR.
  lr: 0.00002
  weight_decay: 5.0e-6
  lr_scheduler: plateau
  lr_decay_gamma: 0.5
  lr_patience: 8
  lr_min: 1.0e-7
  lr_decay_step: 100
  num_workers: 0
  mixed_precision: false
  checkpoint_dir: ./logs/finetune_topology
  # Stop early if val_metric does not improve for this many epochs.
  early_stop_patience: 15
  # Select best checkpoint by metric prediction quality (Log-Euclidean distance).
  select_by: val_metric
  # Do NOT restore the old scheduler state; apply the reduced LR immediately.
  resume_scheduler_state: false
  # Log topology proxy loss to TensorBoard and console.
  log_topo_proxy: true
