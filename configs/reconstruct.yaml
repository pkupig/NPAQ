model:
  k: 20
  emb_dims: 256
  dropout: 0.5

smoothing:
  lambda: 0.1
  k: 10

features:
  curvature_threshold: 0.2
  cluster_eps: 0.05
  min_cluster_size: 10
  line_smoothing: 0.0
  feature_vertex_threshold: 0.05
  feature_edge_threshold: 0.05
  feature_vertex_threshold_edge_ratio: 0.15
  feature_edge_threshold_edge_ratio: 0.35
  feature_edge_min_alignment: 0.55
  feature_edge_weight: 4.0
  feature_edge_weight_alignment_bonus: 2.0
  feature_edge_max_per_quad: 2
  guidance_feature_boost_radius_ratio: 1.5
  guidance_feature_min_confidence: 0.85
  guidance_feature_override_radius_ratio: 1.2
  guidance_feature_refined_boost_radius_ratio: 0.75
  guidance_feature_refined_sample_spacing_ratio: 0.9
  guidance_feature_refined_override_radius_ratio: 0.72
  metric_feature_align_radius_ratio: 1.5
  metric_feature_refined_align_radius_ratio: 0.9
  metric_feature_min_anisotropy_ratio: 1.2
  guidance_corner_suppress_radius_ratio: 0.9
  guidance_corner_refined_suppress_radius_ratio: 0.36
  guidance_corner_confidence: 0.01
  mesh_corner_min_degree: 3
  mesh_dihedral_threshold_deg: 25.0
  mesh_min_polyline_vertices: 2
  mesh_include_boundary: true

miq:
  poisson_depth: 6
  # Cross-field parametrisation  (§5.1 – §5.3)
  crossfield_mu: 10.0        # μ — alignment weight: cross-field follows metric tightly
  # Umbilic handling (near isotropic curvature, e.g. sphere): smooth guidance
  # and reduce local direction forcing to avoid arbitrary noisy principal axes.
  umbilic_smoothing: true
  anisotropy_eps: 0.03
  mu_min_ratio: 0.05
  gradient_size: 1.0         # quad density: smaller → more quads (tune: 0.5–2.0)
  seam_int_weight: 5.0       # λ_int sinusoidal barrier penalty weight
  integer_constraints: true  # set false only for debugging the cross-field
  # If true, integer-grid extraction keeps only quads that form a closed
  # 2-manifold (all edges incidence==2). Recommended for closed-surface tasks.
  require_closed_topology: false
  # Geometric homotopy: progressively reduce anisotropy if fully anisotropic
  # metric fails to yield a valid integer layout.
  anisotropy_schedule: [1.0, 0.7, 0.45, 0.25, 0.0]
  # Global least-squares projection of edge jumps to nearest integers.
  integer_projection_iters: 2
  # Explicit integer vertex-potential refinement (mixed-integer alternating).
  integer_potential_iters: 2
  # Maximum UV distance for integer-grid vertex assignment.
  max_param_dist: 0.7
  # Use C++ libigl/CoMISo MIQ backend (cpp_miq/build/run_miq).
  # Significantly better topology: true seam cutting, integer rounding, vertex welding.
  # New (2026-03-19): quad extraction uses barycentric UV sampling instead of
  # nearest-vertex snapping → eliminates holes from sparse mesh regions.
  # Requires: bash cpp_miq/build.sh (first run downloads libigl ~100MB).
  use_igl_backend: true
  # IGL backend parameters (used when use_igl_backend=true).
  # igl_gradient_size: controls quad density for the C++ MIQ path.
  #   ≤0 = auto-compute from mesh average edge length (recommended).
  #   60 = ~3x auto (21); with 81 holonomy singularities and 2.4x UV overlap,
  #   gradient_size=60 gives ~826 quads with <20 fold-overs (vs 94 at auto=21).
  igl_gradient_size: 80.0    # open-surface default: favor higher-quality denser quads
  igl_stiffness: 5.0
  igl_direct_round: false    # iterative rounding: more stable for 81 singularities
  igl_miq_iter: 20           # 20 iterations; localIter=20 in C++

pd:
  mu: 0.1                    # γ smoothness weight in A = I + γ Lᵀ L
  iterations: 30             # total K PD iterations
  surface_attach_weight: 2.0 # nearest-surface attachment during PD; counters shrinkage/drift
  flip_backtracking: true    # reject/backtrack PD steps that introduce flipped quads
  flip_backtrack_steps: 8
  # End-to-end gradient (§6.5): only the last `unroll_grad_iters` iterations
  # participate in the backward pass; earlier iterations are stop-gradient.
  unroll_grad_iters: 5
  # Anti-flip determinant penalty (§5.3 / §6.4)
  anti_flip_weight: 10.0
  anti_flip_eps: 1.0e-6
  # Gradient isolation for topology generation (§5.3).
  # True: topology Q is fixed; gradients flow only through unrolled PD tail.
  # False: experimental — also backprop through cross-field + parametrisation.
  freeze_rounding_grad: true

topology:
  # Certification gate: fail-fast on invalid topology in both initial and final mesh.
  strict: true
  # Main output selection mode:
  # quality   = prefer dense/high-quality valid candidate
  # balanced  = default tradeoff between density and topology
  # topology  = prefer topology-clean candidate as main output
  selection_mode: balanced
  # Keep true for open surfaces / patches; set false for closed-shape-only evaluation.
  allow_boundary: true
  fill_boundary_quads: true
  fill_boundary_quads_max_loop_len: 4
  fill_boundary_quads_iters: 4
  stitch_boundary_pairs: true
  stitch_boundary_pairs_max_loop_len: 24
  stitch_boundary_pairs_max_centroid_dist_ratio: 0.2
  zipper_self_boundary_loops: true
  zipper_self_boundary_loops_min_loop_len: 32
  zipper_self_boundary_loops_min_gap_ratio: 0.05
  zipper_self_boundary_loops_max_pair_dist_ratio: 0.15
  zipper_self_boundary_loops_iters: 3
  post_orient_zipper: false
