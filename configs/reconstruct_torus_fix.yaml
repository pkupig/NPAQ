model:
  k: 20
  emb_dims: 256
  dropout: 0.5

smoothing:
  lambda: 0.05
  k: 10

features:
  curvature_threshold: 10.0
  cluster_eps: 0.05
  min_cluster_size: 999999
  line_smoothing: false
  mesh_include_boundary: false

miq:
  poisson_depth: 5
  crossfield_mu: 8.0
  umbilic_smoothing: true
  anisotropy_eps: 0.005
  mu_min_ratio: 0.02
  gradient_size: 0.10
  integer_constraints: true
  require_closed_topology: true
  anisotropy_schedule: [0.0]
  integer_projection_iters: 2
  integer_potential_iters: 2
  max_param_dist: 1.0
  use_igl_backend: false
  adaptive_increase_poisson_depth: false

pd:
  mu: 0.1
  iterations: 6
  surface_attach_weight: 1.0
  flip_backtracking: true
  flip_backtrack_steps: 6
  anti_flip_weight: 10.0
  anti_flip_eps: 1.0e-6

topology:
  strict: true
  selection_mode: topology
  allow_boundary: false
  min_quads: 1
  closed_max_retry_profiles: 5
  closed_retry_profiles:
    - gradient_size: 0.08
      crossfield_mu: 10.0
      anisotropy_schedule: [0.0]
      repair_high_order: true
      high_order_repair_max_rounds: 2
      high_order_repair_expand_rounds: 2
      high_order_repair_smoothing_iters: 4
      repair_flow: true
      flow_repair_max_rounds: 2
      flow_repair_expand_rounds: 1
      flow_repair_smoothing_iters: 4
    - gradient_size: 0.06
      crossfield_mu: 12.0
      anisotropy_schedule: [0.0]
      repair_high_order: true
      high_order_repair_max_rounds: 3
      high_order_repair_expand_rounds: 2
      high_order_repair_smoothing_iters: 5
      repair_flow: true
      flow_repair_max_rounds: 3
      flow_repair_expand_rounds: 1
      flow_repair_smoothing_iters: 5
    - gradient_size: 0.05
      crossfield_mu: 14.0
      anisotropy_schedule: [0.0]
      repair_high_order: true
      high_order_repair_max_rounds: 3
      high_order_repair_expand_rounds: 2
      high_order_repair_smoothing_iters: 5
      repair_flow: true
      flow_repair_max_rounds: 3
      flow_repair_expand_rounds: 1
      flow_repair_smoothing_iters: 5
    - gradient_size: 0.04
      crossfield_mu: 16.0
      anisotropy_schedule: [0.0]
      repair_high_order: true
      high_order_repair_max_rounds: 4
      high_order_repair_expand_rounds: 2
      high_order_repair_smoothing_iters: 6
      repair_flow: true
      flow_repair_max_rounds: 4
      flow_repair_expand_rounds: 2
      flow_repair_smoothing_iters: 6
  remesh_boundary_with_miq: false
  prune_boundary_fragments: false
  fill_boundary_quads: false
  stitch_boundary_pairs: false
  zipper_self_boundary_loops: false
  post_pd_planarize: false
  post_pd_shape_polish: false
  post_pd_cleanup: false
  export_topology_alternative: false
  export_triangle_preview: false
